# PitWall — F1 Betting Analytics Platform
# Conda environment definition.
#   conda env create -f environment.yml
#   conda activate f1-analytics
name: f1-analytics
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24,<2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - beautifulsoup4>=4.12
  - requests>=2.31
  - lxml>=4.9
  - openpyxl>=3.1
  - pytest>=7.4
  - pip
  # Packages best installed via pip inside the conda env
  - pip:
      - streamlit>=1.30,<2.0
      - plotly>=5.18,<6.0
      - xgboost>=2.0,<3.0
      - reportlab>=4.0,<5.0
